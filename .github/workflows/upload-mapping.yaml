name: Mapping Upload

on:
  workflow_dispatch:

jobs:
  mapping-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew

      - name: Decode Android Keystore
        run: |
          mkdir -p keystore

          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 -d \
            > keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Inspect app crash mapping
        run: |
          MAPPING="app/build/outputs/mapping/release/mapping.txt"

          echo "=== Todas as referências à MainActivity ==="
          grep -n -F 'MainActivity' "$MAPPING" || true

          echo "=== Método original do crash ==="
          grep -n -F 'onCreate$lambda$0' "$MAPPING" || true

      - name: Verify R8 obfuscation
        run: |
          echo "=== Mapping da MainActivity ==="
          grep -A 20 -B 2 \
            'com.example.mappingtest.MainActivity ->' \
            app/build/outputs/mapping/release/mapping.txt || true

          echo "=== Configuração R8 ==="
          grep -nE 'isMinifyEnabled|isShrinkResources|dontobfuscate|keep' \
            app/build.gradle.kts app/proguard-rules.pro || true         

          echo "=== Mapping do método que gera o crash ==="
          grep -n -A 8 -B 3 'onCreate\$lambda\$0\|ExternalSyntheticLambda' \
            app/build/outputs/mapping/release/mapping.txt || true

          echo "=== Classes e métodos da aplicação ==="
          grep -n -A 12 -B 2 \ 'com\.example\.mappingtest\.MainActivity\$\$ExternalSyntheticLambda\|onCreate\$lambda\$0' \
            app/build/outputs/mapping/release/mapping.txt || true

      - name: Verify Gradle build outputs
        if: always()
        run: |
          echo "Gradle build status:"
          find . -type d -path "*/build/outputs" -print

          echo ""
          echo "APK files:"
          find . -type f -name "*.apk" -print

          echo ""
          echo "Mapping files:"
          find . -type f -name "mapping.txt" -print

          echo ""
          echo "Crashlytics XML files:"
          find . -type f -iname "*mappingfileid*.xml" -print
#ajuste incluido#
      - name: Inspect build output directories
        if: always()
        run: |
          echo "Current directory:"
          pwd

          echo ""
          echo "Repository root:"
          ls -la

          echo ""
          echo "Build directories:"
          find . -type d -name build -print

          echo ""
          echo "Crashlytics mapping ID XML files:"
          find . -type f -iname "*mappingfileid*.xml" -print

      - name: Find and collect Crashlytics mapping ID XML
        shell: bash
        run: |
          echo "Searching for Crashlytics mappingfileid XML..."

          find app/build -type f \
            -iname "*mappingfileid*.xml" \
            -print

          mkdir -p crashlytics-xml

          find app/build -type f \
            -iname "*mappingfileid*.xml" \
            -exec cp --parents {} crashlytics-xml/ \;

          echo ""
          echo "Collected XML files:"
          find crashlytics-xml -type f -print

          echo ""
          echo "XML contents:"
          find crashlytics-xml -type f -name "*.xml" \
            -exec sh -c 'echo "--- $1"; cat "$1"; echo' _ {} \;

      - name: Upload Crashlytics mapping ID XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: crashlytics-mapping-id-xml
          path: crashlytics-xml/
          if-no-files-found: warn

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)

          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify generated files
        run: |
          ls -R app/build/outputs/
          ls -R app/build/outputs/mapping/

      - name: Find Crashlytics mapping file ID XML
        run: |
          echo "Searching for Crashlytics mappingfileid XML..."

          find app/build -iname "*mappingfileid*" || true

          echo ""
          echo "Detailed XML search:"

          find app/build \
            -type f \
            \( -iname "*.xml" -o -iname "*crashlytics*" \) \
            | sort || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute \
          app/build/outputs/apk/release/app-release.apk \
          --app ${{ secrets.FIREBASE_APP_ID }} \
          --groups "testers"

      # - name: Upload mapping file to Crashlytics
      #   env:
      #     KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      #     KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      #     KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      #   run: |
      #     ./gradlew app:uploadCrashlyticsMappingFileRelease