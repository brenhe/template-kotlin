name: Mapping Upload

on:
  workflow_dispatch:

jobs:
  mapping-test:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools, platforms;android-36, build-tools;36.0.0'

      - name: Grant execute permission to Gradle
        run: chmod +x ./gradlew
#ajuste incluido#
      - name: Find and collect Crashlytics mapping ID XML
        shell: bash
        run: |
          echo "Searching for Crashlytics mappingfileid XML..."

          find app/build -type f \
            -iname "*mappingfileid*.xml" \
            -print

          mkdir -p crashlytics-xml

          find app/build -type f \
            -iname "*mappingfileid*.xml" \
            -exec cp --parents {} crashlytics-xml/ \;

          echo ""
          echo "Collected XML files:"
          find crashlytics-xml -type f -print

          echo ""
          echo "XML contents:"
          find crashlytics-xml -type f -name "*.xml" \
            -exec sh -c 'echo "--- $1"; cat "$1"; echo' _ {} \;

      - name: Upload Crashlytics mapping ID XML artifact
        uses: actions/upload-artifact@v4
        with:
          name: crashlytics-mapping-id-xml
          path: crashlytics-xml/
          if-no-files-found: warn

      - name: Decode Android Keystore
        run: |
          mkdir -p keystore

          echo "${{ secrets.KEYSTORE_BASE64 }}" \
            | base64 -d \
            > keystore/release.jks

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew assembleRelease

      - name: Upload Crashlytics mapping ID XML
        uses: actions/upload-artifact@v4
        with:
          name: crashlytics-mapping-id-xml
          path: app/build/**/com_google_firebase_crashlytics_mappingfileid.xml
          if-no-files-found: warn

      - name: Verify APK signature
        run: |
          BUILD_TOOLS=$(ls $ANDROID_HOME/build-tools | sort -V | tail -n 1)

          $ANDROID_HOME/build-tools/$BUILD_TOOLS/apksigner verify \
            --verbose \
            app/build/outputs/apk/release/app-release.apk

      - name: Verify generated files
        run: |
          ls -R app/build/outputs/
          ls -R app/build/outputs/mapping/

      - name: Find Crashlytics mapping file ID XML
        run: |
          echo "Searching for Crashlytics mappingfileid XML..."

          find app/build -iname "*mappingfileid*" || true

          echo ""
          echo "Detailed XML search:"

          find app/build \
            -type f \
            \( -iname "*.xml" -o -iname "*crashlytics*" \) \
            | sort || true

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Upload Mapping artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-mapping
          path: app/build/outputs/mapping/release/mapping.txt

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Upload APK to Firebase App Distribution
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          firebase appdistribution:distribute \
          app/build/outputs/apk/release/app-release.apk \
          --app ${{ secrets.FIREBASE_APP_ID }} \
          --groups "testers"

      - name: Upload mapping file to Crashlytics
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          ./gradlew app:uploadCrashlyticsMappingFileRelease